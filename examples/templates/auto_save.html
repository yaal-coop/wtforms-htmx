{% extends "base.html" %}

{% block extra_head %}

{% endblock %}

{% block content %}

    <div class="demo-area">
      {{ form.name() }}
      {{ form.email() }}
      {{ form.website() }}
      {{ form.age() }}
      {{ form.save() }}
    </div>
  </form>
{% endblock %}
