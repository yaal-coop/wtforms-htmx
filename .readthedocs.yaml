version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.15"
    nodejs: "22"
  # System libraries required by the Chromium that sphinxcontrib-screenshot
  # drives through Playwright. Read the Docs has no sudo at build time, so
  # `playwright install --with-deps` is not an option: the OS dependencies are
  # installed as apt packages and only the browser binary is fetched below.
  apt_packages:
    - libasound2t64
    - libatk-bridge2.0-0t64
    - libatk1.0-0t64
    - libatspi2.0-0t64
    - libcairo2
    - libcups2t64
    - libdbus-1-3
    - libdrm2
    - libgbm1
    - libglib2.0-0t64
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
  jobs:
    post_install:
      - npm ci --no-audit --no-fund
      - uv run --no-sync playwright install chromium

python:
  install:
    - method: uv
      command: sync
      groups:
        - doc
        - example

sphinx:
  builder: dirhtml
  configuration: docs/conf.py

formats:
  - pdf
  - epub
